<!doctype html>
<meta charset="utf-8">
<style>html,body{margin:0;background:#111}canvas{display:block}</style>
<canvas id="c" width="640" height="854"></canvas>
<script>
const W = 640, H = 854;
const ZEMIN = '#0A0C0F';
const c = document.getElementById('c');
const x = c.getContext('2d');

/* ---- yardımcılar ---- */
function rng(seed) {            // deterministik: her kart her seferinde aynı çıksın
  let s = seed * 9301 + 49297;
  return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
}
function hexRgb(h) {
  return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
}
function rgba(h, a) { const [r,g,b] = hexRgb(h); return `rgba(${r},${g},${b},${a})`; }

function isik(renk, gucu) {      // çizgilere hafif hale
  x.shadowColor = rgba(renk, gucu);
  x.shadowBlur = 18;
}
function halesiz() { x.shadowBlur = 0; }

function cizgi(x1,y1,x2,y2,renk,kalinlik,alfa) {
  x.strokeStyle = rgba(renk, alfa); x.lineWidth = kalinlik;
  x.beginPath(); x.moveTo(x1,y1); x.lineTo(x2,y2); x.stroke();
}
function cember(cx,cy,r,renk,kalinlik,alfa,bas,son) {
  x.strokeStyle = rgba(renk, alfa); x.lineWidth = kalinlik;
  x.beginPath(); x.arc(cx,cy,r,bas===undefined?0:bas,son===undefined?Math.PI*2:son); x.stroke();
}
function nokta(cx,cy,r,renk,alfa) {
  x.fillStyle = rgba(renk, alfa);
  x.beginPath(); x.arc(cx,cy,r,0,Math.PI*2); x.fill();
}

/* ---- ortak çerçeve ---- */
function zemin(renk, sicak) {
  x.fillStyle = ZEMIN; x.fillRect(0,0,W,H);
  const g = x.createRadialGradient(W*sicak.gx, H*sicak.gy, 0, W*sicak.gx, H*sicak.gy, W*0.95);
  g.addColorStop(0, rgba(renk, 0.16)); g.addColorStop(0.55, rgba(renk, 0.04)); g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(0,0,W,H);
}
function tarama(aci) {           // ince eğik tarama çizgileri — tüm serinin ortak dokusu
  x.save(); x.translate(W/2,H/2); x.rotate(aci*Math.PI/180); x.translate(-W,-H);
  x.strokeStyle = 'rgba(255,255,255,0.038)'; x.lineWidth = 1;
  for (let i=0;i<160;i++){ const y=i*13; x.beginPath(); x.moveTo(0,y); x.lineTo(W*2,y); x.stroke(); }
  x.restore();
}
function tane() {                // film taneciği
  const im = x.getImageData(0,0,W,H), d = im.data;
  for (let i=0;i<d.length;i+=4){
    const n = (Math.random()-0.5)*13;
    d[i]+=n; d[i+1]+=n; d[i+2]+=n;
  }
  x.putImageData(im,0,0);
}
function vinyet() {
  const g = x.createRadialGradient(W/2,H/2,H*0.28,W/2,H/2,H*0.78);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,0.55)');
  x.fillStyle=g; x.fillRect(0,0,W,H);
}

/* ---- 14 motif ---- */
const MOTIFLER = [
  // 01 Bağlan ve ısın — kenarlardan tek düğüme yakınsayan iplikler
  (r, k) => {
    const cx=W/2, cy=H*0.46;
    isik(k,.5);
    for(let i=0;i<34;i++){
      const a=r()*Math.PI*2, d=H*0.55+r()*H*0.35;
      cizgi(cx+Math.cos(a)*d, cy+Math.sin(a)*d, cx, cy, k, r()<.2?1.4:0.7, 0.1+r()*0.3);
    }
    halesiz();
    isik(k,.9); nokta(cx,cy,7,k,1); halesiz();
    cember(cx,cy,26,k,1,.5); cember(cx,cy,46,k,1,.22);
  },
  // 02 Nabız yoklaması — dağınık noktalar üç sütuna toplanıyor
  (r, k) => {
    const taban=H*0.72, gen=[H*0.30,H*0.20,H*0.13], sx=[W*0.28,W*0.5,W*0.72];
    for(let i=0;i<130;i++){
      const s=Math.floor(r()*3), yerlesti=r()<0.62;
      const px = yerlesti ? sx[s]+(r()-.5)*66 : r()*W;
      const py = yerlesti ? taban-r()*gen[s] : r()*H*0.55;
      nokta(px,py,yerlesti?2.6:1.6,k,yerlesti?0.55:0.16);
    }
    isik(k,.6);
    for(let s=0;s<3;s++){
      x.fillStyle=rgba(k,0.1); x.fillRect(sx[s]-34,taban-gen[s],68,gen[s]);
      cizgi(sx[s]-34,taban-gen[s],sx[s]+34,taban-gen[s],k,2,0.85);
    }
    halesiz();
    cizgi(W*0.14,taban,W*0.86,taban,k,1,0.3);
  },
  // 03 Scrum döngüsü — üç yaydan kapalı halka
  (r, k) => {
    const cx=W/2, cy=H*0.46, R=W*0.28;
    isik(k,.55);
    for(let i=0;i<3;i++){
      const b=i*(Math.PI*2/3)+0.16, s=b+Math.PI*2/3-0.32;
      cember(cx,cy,R,k,3,0.9,b,s);
      const ux=cx+Math.cos(s)*R, uy=cy+Math.sin(s)*R;
      x.save(); x.translate(ux,uy); x.rotate(s+Math.PI/2);
      x.fillStyle=rgba(k,0.95); x.beginPath(); x.moveTo(0,-9); x.lineTo(8,7); x.lineTo(-8,7); x.closePath(); x.fill();
      x.restore();
    }
    halesiz();
    cember(cx,cy,R*0.55,k,1,0.2); cember(cx,cy,R*1.45,k,1,0.12);
  },
  // 04 AI katmanları — iç içe dört halka
  (r, k) => {
    const cx=W/2, cy=H*0.46;
    for(let i=3;i>=0;i--){
      const R=W*0.34-i*W*0.075, a=0.24+(3-i)*0.24;
      isik(k,a*0.7); cember(cx,cy,R,k,i===0?3:1.6,a); halesiz();
      x.fillStyle=rgba(k,0.028); x.beginPath(); x.arc(cx,cy,R,0,Math.PI*2); x.fill();
      cizgi(cx+R,cy,W*0.9,cy-i*20-14,k,1,0.14);
    }
    isik(k,1); nokta(cx,cy,5,k,1); halesiz();
  },
  // 05 İlk yarış — farklı hızlarda ışık izleri
  (r, k) => {
    const yl=[H*0.32,H*0.44,H*0.56,H*0.68], boy=[0.78,0.52,0.40,0.30];
    yl.forEach((y,i)=>{
      cizgi(W*0.1,y,W*0.92,y,k,1,0.12);
      const bit=W*0.1+(W*0.82)*boy[i];
      const g=x.createLinearGradient(W*0.1,0,bit,0);
      g.addColorStop(0,rgba(k,0)); g.addColorStop(1,rgba(k,i===0?0.95:0.4));
      x.strokeStyle=g; x.lineWidth=i===0?3.5:2;
      isik(k,i===0?0.8:0.3);
      x.beginPath(); x.moveTo(W*0.1,y); x.lineTo(bit,y); x.stroke();
      halesiz();
      nokta(bit,y,i===0?6:4,k,i===0?1:0.55);
    });
    cizgi(W*0.1,H*0.24,W*0.1,H*0.76,k,1,0.28);
  },
  // 06 Beş olay — bir iplikle dizilmiş beş sütun
  (r, k) => {
    const taban=H*0.70, y=[0.30,0.46,0.22,0.38,0.26];
    isik(k,.35);
    x.strokeStyle=rgba(k,0.65); x.lineWidth=1.6; x.beginPath();
    for(let i=0;i<5;i++){ const px=W*0.16+i*W*0.17, py=taban-H*y[i]; i?x.lineTo(px,py):x.moveTo(px,py); }
    x.stroke(); halesiz();
    for(let i=0;i<5;i++){
      const px=W*0.16+i*W*0.17, h=H*y[i];
      x.fillStyle=rgba(k,0.09); x.fillRect(px-17,taban-h,34,h);
      x.strokeStyle=rgba(k,0.42); x.lineWidth=1; x.strokeRect(px-17,taban-h,34,h);
      isik(k,.7); nokta(px,taban-h,4.5,k,0.95); halesiz();
    }
    cizgi(W*0.08,taban,W*0.92,taban,k,1,0.3);
  },
  // 07 Canlı demo — prizmadan ayrışan ışın
  (r, k) => {
    const px=W*0.44, py=H*0.46;
    isik(k,.7); cizgi(W*0.02,H*0.30,px,py,k,3,0.9); halesiz();
    x.strokeStyle=rgba(k,0.5); x.lineWidth=1.5;
    x.beginPath(); x.moveTo(px,py-56); x.lineTo(px+52,py+34); x.lineTo(px-52,py+34); x.closePath();
    x.fillStyle=rgba(k,0.06); x.fill(); x.stroke();
    for(let i=0;i<6;i++){
      const y=py-46+i*19;
      isik(k,.3); cizgi(px+54,py+6,W*0.99,y,k,1.4,0.62-i*0.07); halesiz();
    }
  },
  // 08 Salı'dan ne kaldı — dağılmış parçalar merkeze geri toplanıyor
  (r, k) => {
    const cx=W/2, cy=H*0.46;
    // uzaktakiler: sönük, eğik, dağınık
    for(let i=0;i<14;i++){
      const a=r()*Math.PI*2, d=W*0.34+r()*W*0.22, s=16+r()*20;
      const px=cx+Math.cos(a)*d, py=cy+Math.sin(a)*d*1.05;
      x.save(); x.translate(px,py); x.rotate(a*1.6);
      x.strokeStyle=rgba(k,0.24); x.lineWidth=1.2; x.strokeRect(-s/2,-s/2,s,s);
      x.restore();
      cizgi(px,py,cx+Math.cos(a)*W*0.17,cy+Math.sin(a)*W*0.17,k,0.8,0.13);
    }
    // yakındakiler: hizalanmış halka
    isik(k,.6);
    for(let i=0;i<10;i++){
      const a=i*(Math.PI*2/10)-Math.PI/2, R=W*0.20;
      const px=cx+Math.cos(a)*R, py=cy+Math.sin(a)*R, s=26;
      x.save(); x.translate(px,py); x.rotate(a+Math.PI/2);
      x.fillStyle=rgba(k,0.12); x.strokeStyle=rgba(k,0.8); x.lineWidth=1.6;
      x.fillRect(-s/2,-s/2,s,s); x.strokeRect(-s/2,-s/2,s,s);
      x.restore();
    }
    halesiz();
    nokta(cx,cy,5,k,0.9);
  },
  // 09 Atölye 1 — aynı başlangıç, iki farklı yol
  (r, k) => {
    const bx=W*0.11, by=H*0.46, adim=W*0.125;
    isik(k,.9); nokta(bx,by,8,k,1); halesiz();
    cember(bx,by,18,k,1,0.35);
    // üst: zayıf prompt — kırık, dağınık, sönük
    x.strokeStyle=rgba(k,0.3); x.lineWidth=1.4; x.setLineDash([5,5]);
    x.beginPath(); x.moveTo(bx,by);
    for(let i=1;i<=6;i++) x.lineTo(bx+i*adim, by-100+(r()-0.5)*150);
    x.stroke(); x.setLineDash([]);
    for(let i=1;i<=6;i++) nokta(bx+i*adim, by-100+(r()-0.5)*10 - 0, 2.2, k, 0.2);
    // alt: iyi prompt — düzenli, parlak, düğümlü
    isik(k,.75); x.strokeStyle=rgba(k,0.92); x.lineWidth=2.8;
    x.beginPath(); x.moveTo(bx,by);
    const yy=[];
    for(let i=1;i<=6;i++){ const py=by+72+Math.sin(i*0.55)*9; yy.push(py); x.lineTo(bx+i*adim,py); }
    x.stroke(); halesiz();
    yy.forEach((py,i)=>{ nokta(bx+(i+1)*adim, py, 4.6, k, 0.95); });
  },
  // 10 Atölye 2 — parçacıklar kümeleniyor
  (r, k) => {
    const merkez=[[W*0.31,H*0.36],[W*0.66,H*0.44],[W*0.46,H*0.66]];
    merkez.forEach((m,mi)=>{
      const n=16+mi*4;
      for(let i=0;i<n;i++){
        const a=r()*Math.PI*2, d=r()*(52+mi*16);
        const px=m[0]+Math.cos(a)*d, py=m[1]+Math.sin(a)*d;
        cizgi(m[0],m[1],px,py,k,0.7,0.16);
        nokta(px,py,2.4,k,0.5);
      }
      isik(k,.55); cember(m[0],m[1],62+mi*16,k,1.4,0.45); halesiz();
      nokta(m[0],m[1],5,k,0.95);
    });
    // kümeye girmeyen tek işaret — atölyenin asıl sorusu
    isik(k,.9); nokta(W*0.83,H*0.78,6,'#E9B949',1); halesiz();
    cember(W*0.83,H*0.78,17,'#E9B949',1.4,0.6);
  },
  // 11 Neyi asla yapıştırma — geçilmeyen sınır
  (r, k) => {
    const sy=H*0.54;
    // alt bölge: korunan taraf
    const g=x.createLinearGradient(0,sy,0,H);
    g.addColorStop(0,rgba(k,0.10)); g.addColorStop(1,rgba(k,0.01));
    x.fillStyle=g; x.fillRect(0,sy,W,H-sy);
    // sınır çizgisi
    isik(k,.8);
    x.strokeStyle=rgba(k,0.95); x.lineWidth=3; x.setLineDash([16,9]);
    x.beginPath(); x.moveTo(W*0.05,sy); x.lineTo(W*0.95,sy); x.stroke();
    x.setLineDash([]); halesiz();
    // üstten gelip sınırda duran parçacıklar
    for(let i=0;i<11;i++){
      const px=W*0.10+i*W*0.08+(r()-0.5)*16;
      const bas=H*0.06+r()*H*0.28;
      cizgi(px,bas,px,sy-16,k,1.3,0.28);
      nokta(px,bas,2.6,k,0.4);
      // sınıra çarpma izi
      cizgi(px-9,sy-9,px+9,sy-9,k,1.6,0.6);
    }
    cember(W/2,sy,W*0.42,k,1,0.10);
  },
  // 12 Çalışma anlaşması — birbirine geçen halkalar
  (r, k) => {
    const cx=W/2, cy=H*0.46, R=W*0.30;
    for(let i=0;i<5;i++){
      const a=i*(Math.PI*2/5)-Math.PI/2;
      const px=cx+Math.cos(a)*R*0.62, py=cy+Math.sin(a)*R*0.62;
      isik(k,.5); cember(px,py,R*0.46,k,2,0.7); halesiz();
      x.fillStyle=rgba(k,0.035); x.beginPath(); x.arc(px,py,R*0.46,0,Math.PI*2); x.fill();
    }
    isik(k,.9); nokta(cx,cy,5,k,1); halesiz();
  },
  // 13 Final — podyum
  (r, k) => {
    const taban=H*0.72, gen=W*0.20, yuk=[0.15,0.31,0.22], sira=[0,1,2];
    sira.forEach((s)=>{
      const px=W*0.13+s*gen*1.08, h=H*yuk[s], parlak=(s===1);
      x.fillStyle=rgba(k,parlak?0.16:0.055); x.fillRect(px,taban-h,gen,h);
      isik(k,parlak?0.85:0.25);
      x.strokeStyle=rgba(k,parlak?0.95:0.38); x.lineWidth=parlak?2.6:1.3;
      x.strokeRect(px,taban-h,gen,h);
      halesiz();
      // üst kenar vurgusu
      cizgi(px,taban-h,px+gen,taban-h,k,parlak?3.4:1.6,parlak?1:0.5);
    });
    // kazananın üstünde tek nokta ve halka — sade
    const kx=W*0.13+gen*1.08+gen/2, ky=taban-H*yuk[1]-52;
    isik(k,.9); nokta(kx,ky,6,k,1); halesiz();
    cember(kx,ky,20,k,1.6,0.55); cember(kx,ky,34,k,1,0.22);
    cizgi(W*0.08,taban,W*0.92,taban,k,1.8,0.45);
  },
  // 14 Taahhüt — tek tohum, yayılan halkalar
  (r, k) => {
    const cx=W/2, cy=H*0.48;
    for(let i=0;i<6;i++){
      cember(cx,cy,34+i*44,k,i===0?2:1,0.5-i*0.08);
    }
    isik(k,1); nokta(cx,cy,8,k,1); halesiz();
    for(let i=0;i<4;i++){
      const a=-Math.PI/2+i*(Math.PI/2)+0.4;
      cizgi(cx+Math.cos(a)*40, cy+Math.sin(a)*40, cx+Math.cos(a)*250, cy+Math.sin(a)*250, k,1,0.14);
    }
  }
];

window.ciz = function(i, renk) {
  const r = rng(i * 137 + 11);
  x.clearRect(0,0,W,H);
  zemin(renk, { gx: 0.22 + (i % 5) * 0.14, gy: 0.16 + (i % 3) * 0.22 });
  tarama(18 + i * 13);
  x.save(); MOTIFLER[i](r, renk); x.restore();
  halesiz();
  vinyet();
  tane();
  return c.toDataURL('image/jpeg', 0.9);
};
</script>
